<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CURE Market Maker Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --accent-green: #4caf50;
            --accent-red: #f44336;
            --border: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .grid-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
        }
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-box {
            background-color: var(--bg-card);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--text-muted); font-weight: normal; }
        .text-green { color: var(--accent-green); }
        .text-red { color: var(--accent-red); }
        .scrollable { max-height: 400px; overflow-y: auto; }
        .scrollable::-webkit-scrollbar { width: 6px; }
        .scrollable::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        
        /* Orderbook specific layout */
        .orderbook-container { display: flex; gap: 10px; }
        .orderbook-half { flex: 1; }
    </style>
</head>
<body>

    <div class="header">
        <h2>CURE Market Maker</h2>
        <div style="color: var(--text-muted);" id="lastUpdate">Last Update: --</div>
    </div>

    <div class="stats-row">
        <div class="stat-box">
            <div style="color: var(--text-muted)">Mid Price</div>
            <div class="stat-value" id="midPrice">--</div>
        </div>
        <div class="stat-box">
            <div style="color: var(--text-muted)">Total CURE Inventory</div>
            <div class="stat-value text-green" id="inventory">--</div>
        </div>
        <div class="stat-box">
            <div style="color: var(--text-muted)">Available BTC</div>
            <div class="stat-value text-green" id="btcBalance">--</div>
        </div>
        <div class="stat-box">
            <div style="color: var(--text-muted)">Active Bot Orders</div>
            <div class="stat-value"><span id="buyOrders" class="text-green">0</span> / <span id="sellOrders" class="text-red">0</span></div>
        </div>
    </div>

    <div class="grid-container">
        
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="card" style="height: 400px;">
                <canvas id="priceChart"></canvas>
            </div>
            
            <div class="card">
                <h3>My Active Orders</h3>
                <div class="scrollable">
                    <table id="myOrdersTable">
                        <thead>
                            <tr>
                                <th>Side</th>
                                <th>Price</th>
                                <th>Amount</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="card">
                <h3>Market Order Book</h3>
                <div class="orderbook-container">
                    <div class="orderbook-half scrollable">
                        <table id="bidsTable">
                            <thead><tr><th>Bid Price</th><th>Amount</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div class="orderbook-half scrollable">
                        <table id="asksTable">
                            <thead><tr><th>Ask Price</th><th>Amount</th></tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Recent Market Trades</h3>
                <div class="scrollable">
                    <table id="tradesTable">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Price</th>
                                <th>Amount</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let chart = null;
        let lastKlineUpdate = 0;

        function updateDashboard() {
            fetch('/api/status')
                .then(res => res.json())
                .then(data => {
                    // Update Top Stats
                    document.getElementById('lastUpdate').innerText = 'Last Update: ' + (data.last_update || '--');
                    document.getElementById('midPrice').innerText = data.mid_price ? data.mid_price.toFixed(8) : '--';
                    
                    // Display the newly synced balances
                    document.getElementById('inventory').innerText = data.inventory !== undefined ? data.inventory.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '--';
                    document.getElementById('btcBalance').innerText = data.btc_balance !== undefined ? data.btc_balance.toFixed(8) : '--';
                    
                    document.getElementById('buyOrders').innerText = data.buy_orders || 0;
                    document.getElementById('sellOrders').innerText = data.sell_orders || 0;
                    
                    if (data.ticker_24hr && data.ticker_24hr.volume) {
                        document.getElementById('volume').innerText = parseFloat(data.ticker_24hr.volume).toFixed(2);
                    }

                    // Update My Active Orders
                    const myOrdersBody = document.querySelector('#myOrdersTable tbody');
                    if (data.all_active_orders) {
                        myOrdersBody.innerHTML = data.all_active_orders.map(o => `
                            <tr>
                                <td class="${o.side === 'buy' ? 'text-green' : 'text-red'}">${o.side.toUpperCase()}</td>
                                <td>${parseFloat(o.price).toFixed(8)}</td>
                                <td>${parseFloat(o.remaining).toFixed(2)}</td>
                                <td>${o.status}</td>
                            </tr>
                        `).join('');
                    }

                    // Update Market Orderbook safely
                    if (data.orderbook) {
                        const bidsBody = document.querySelector('#bidsTable tbody');
                        const asksBody = document.querySelector('#asksTable tbody');
                        
                        // Added ?. to safely handle empty data streams
                        bidsBody.innerHTML = (data.orderbook?.bids || []).slice(0, 50).map(b => `
                            <tr><td class="text-green">${parseFloat(b.price).toFixed(8)}</td><td>${parseFloat(b.quantity).toFixed(2)}</td></tr>
                        `).join('');
                        
                        asksBody.innerHTML = (data.orderbook?.asks || []).slice(0, 50).map(a => `
                            <tr><td class="text-red">${parseFloat(a.price).toFixed(8)}</td><td>${parseFloat(a.quantity).toFixed(2)}</td></tr>
                        `).join('');
                    }

                    // Update Recent Trades safely
                    if (data.recent_trades && Array.isArray(data.recent_trades)) {
                        const tradesBody = document.querySelector('#tradesTable tbody');
                        tradesBody.innerHTML = data.recent_trades.slice(0, 50).map(t => {
                            const date = new Date(t.timestamp).toLocaleTimeString();
                            const colorClass = t.side === 'buy' ? 'text-green' : 'text-red';
                            return `<tr><td>${date}</td><td class="${colorClass}">${parseFloat(t.price).toFixed(8)}</td><td>${parseFloat(t.quantity).toFixed(2)}</td></tr>`;
                        }).join('');
                    }

                    // Update Chart
                    if (data.klines && data.klines.length > 0) {
                        updateChart(data.klines);
                    }
                })
                .catch(err => console.error('Dashboard Update Error:', err));
        }

        function updateChart(klines) {
            const now = Date.now();
            if (chart && now - lastKlineUpdate < 30000) return; // Only redraw chart every 30s
            lastKlineUpdate = now;

            const ctx = document.getElementById('priceChart').getContext('2d');
            if (chart) chart.destroy();

            const chartData = klines.sort((a, b) => a.time - b.time).map(k => ({
                x: new Date(k.time), o: parseFloat(k.open), h: parseFloat(k.high), l: parseFloat(k.low), c: parseFloat(k.close)
            }));

            chart = new Chart(ctx, {
                type: 'candlestick',
                data: { datasets: [{ label: 'BTC_CURE', data: chartData, color: { up: '#4caf50', down: '#f44336' } }] },
                options: {
                    responsive: true, maintainAspectRatio: false, animation: false,
                    scales: {
                        x: { type: 'time', grid: { color: '#333' }, ticks: { color: '#888' } },
                        y: { position: 'right', grid: { color: '#333' }, ticks: { color: '#888', precision: 8 } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        setInterval(updateDashboard, 5000);
        updateDashboard();
    </script>
</body>
</html>
